// ── ELLIOTT WAVE ENGINE ──────────────────────────────────────
function detectWaves(data){
  if(data.length<20) return[];
  const prices=data.map(d=>d.price);
  const n=prices.length;
  const win=Math.max(3,Math.floor(n/20));

  // Find pivots
  const pivots=[];
  for(let i=win;i<n-win;i++){
    const sl=prices.slice(i-win,i+win+1);
    const mx=Math.max(...sl),mn=Math.min(...sl);
    if(prices[i]===mx&&prices[i]>prices[i-1]&&prices[i]>prices[i+1])
      pivots.push({idx:i,price:prices[i],type:'peak',date:data[i].date,vol:data[i].vol});
    else if(prices[i]===mn&&prices[i]<prices[i-1]&&prices[i]<prices[i+1])
      pivots.push({idx:i,price:prices[i],type:'trough',date:data[i].date,vol:data[i].vol});
  }

  // Add first and last
  const firstType=prices[0]<prices[Math.floor(n/4)]?'trough':'peak';
  pivots.unshift({idx:0,price:prices[0],type:firstType,date:data[0].date,vol:data[0].vol});
  pivots.push({idx:n-1,price:prices[n-1],type:'current',date:data[n-1].date,vol:data[n-1].vol});

  // Filter significant pivots (min 10% move)
  const sig=[pivots[0]];
  for(let i=1;i<pivots.length;i++){
    const prev=sig[sig.length-1],curr=pivots[i];
    if(prev.type===curr.type){
      if(curr.type==='peak'&&curr.price>prev.price) sig[sig.length-1]=curr;
      else if(curr.type==='trough'&&curr.price<prev.price) sig[sig.length-1]=curr;
      continue;
    }
    const pct=Math.abs((curr.price-prev.price)/prev.price);
    if(pct>0.10) sig.push(curr);
  }

  // Apply EW rules validation
  const validated=validateEW(sig);
  return validated;
}

function validateEW(pivots){
  if(pivots.length<2) return pivots;
  const labels=['W1','W2','W3','W4','W5','Wave A','Wave B','Wave C'];
  const result=[];

  for(let i=0;i<Math.min(pivots.length,8);i++){
    const p=pivots[i];
    const label=labels[i]||`P${i+1}`;
    let valid=true;
    let note='';
    let color=p.type==='peak'?'#22c55e':p.type==='trough'?'#ef4444':'#f0b429';

    // W2 rule: cannot retrace more than 100% of W1
    if(i===2&&result.length>=2){
      const w1Start=result[0].price;
      const w1End=result[1].price;
      const w2End=p.price;
      const w1Range=Math.abs(w1End-w1Start);
      const w2Retrace=Math.abs(w2End-w1End);
      const retracePct=(w2Retrace/w1Range)*100;
      if(w2End<w1Start){valid=false;note='⚠️ W2 > 100% W1';}
      else note=`Retrace: ${retracePct.toFixed(0)}%`;
    }

    // W3 rule: must be longer than W1
    if(i===3&&result.length>=3){
      const w1Size=Math.abs(result[1].price-result[0].price);
      const w3Size=Math.abs(p.price-result[2].price);
      if(w3Size<w1Size){color='#f97316';note='⚠️ W3 < W1 — check count';}
      else note=`${((w3Size/result[2].price)*100).toFixed(0)}% gain`;
    }

    // W4 rule: cannot overlap W1 territory
    if(i===4&&result.length>=2){
      const w1Top=result[1].price;
      if(p.price<w1Top){color='#f97316';note='⚠️ W4 overlaps W1';}
      else note='No W1 overlap ✓';
    }

    result.push({...p,label,color,valid,note});
  }
  return result;
}

// ── FIBONACCI LEVELS ─────────────────────────────────────────
function calcFibs(waves){
  if(waves.length<2) return[];
  const fibs=[];
  const last=waves[waves.length-1];
  const prev=waves[waves.length-2];
  if(!prev||!last) return[];

  const high=Math.max(prev.price,last.price);
  const low=Math.min(prev.price,last.price);
  const range=high-low;

  [0.236,0.382,0.500,0.618,0.786].forEach(r=>{
    fibs.push({level:r,price:high-(range*r),label:`${(r*100).toFixed(1)}%`,color:'#3b82f666'});
  });

  // Extension levels for targets
  if(waves.length>=3){
    const w1Size=Math.abs(waves[1].price-waves[0].price);
    const base=waves[waves.length-1].price;
    [1.0,1.272,1.618,2.0,2.618].forEach(r=>{
      fibs.push({level:r,price:base+(w1Size*r),label:`${r}× ext`,color:'#22c55e44',ext:true});
    });
  }
  return fibs;
}

// ── RSI CALCULATION ──────────────────────────────────────────
function calcRSI(data,period=14){
  const prices=data.map(d=>d.price);
  const rsi=new Array(prices.length).fill(null);
  if(prices.length<period+1) return rsi;

  let gains=0,losses=0;
  for(let i=1;i<=period;i++){
    const diff=prices[i]-prices[i-1];
    if(diff>0) gains+=diff; else losses+=Math.abs(diff);
  }
  let avgGain=gains/period,avgLoss=losses/period;

  for(let i=period;i<prices.length;i++){
    if(i>period){
      const diff=prices[i]-prices[i-1];
      const gain=diff>0?diff:0;
      const loss=diff<0?Math.abs(diff):0;
      avgGain=(avgGain*(period-1)+gain)/period;
      avgLoss=(avgLoss*(period-1)+loss)/period;
    }
    const rs=avgLoss===0?100:avgGain/avgLoss;
    rsi[i]=100-(100/(1+rs));
  }
  return rsi;
}

// ── MACD CALCULATION ─────────────────────────────────────────
function calcMACD(data,fast=12,slow=26,sig=9){
  const prices=data.map(d=>d.price);
  const ema=(arr,period)=>{
    const k=2/(period+1);
    const result=new Array(arr.length).fill(null);
    let sum=0,count=0;
    for(let i=0;i<arr.length;i++){
      sum+=arr[i];count++;
      if(count===period){result[i]=sum/period;}
      else if(count>period&&result[i-1]!==null){result[i]=arr[i]*k+result[i-1]*(1-k);}
    }
    return result;
  };
  const fastEMA=ema(prices,fast);
  const slowEMA=ema(prices,slow);
  const macdLine=prices.map((_,i)=>fastEMA[i]!==null&&slowEMA[i]!==null?fastEMA[i]-slowEMA[i]:null);
  const validMacd=macdLine.filter(v=>v!==null);
  const sigLine=ema(validMacd,sig);
  const macdFull=[...new Array(macdLine.length-validMacd.length).fill(null),...sigLine];
  const hist=macdLine.map((v,i)=>v!==null&&macdFull[i]!==null?v-macdFull[i]:null);
  return{macd:macdLine,signal:macdFull,hist};
}

// ── SIGNAL ENGINE ────────────────────────────────────────────
function generateSignal(waves,data,rsi,macd){
  const price=data[data.length-1]?.price||0;
  const ath=INFO?.market_data?.ath?.usd||Math.max(...data.map(d=>d.price));
  const atl=INFO?.market_data?.atl?.usd||Math.min(...data.map(d=>d.price));
  const pctFromATH=((price-ath)/ath)*100;
  const curRSI=rsi.filter(v=>v!==null).slice(-1)[0]||50;
  const curMACD=macd.hist.filter(v=>v!==null).slice(-1)[0]||0;
  const prevMACD=macd.hist.filter(v=>v!==null).slice(-2,-1)[0]||0;
  const macdCross=curMACD>0&&prevMACD<=0;
  const macdTurning=curMACD>prevMACD;

  // W2 entry detection
  let entryType='';
  let w1Size=0,w2RetracePct=0;
  if(waves.length>=3){
    w1Size=Math.abs(waves[1].price-waves[0].price);
    w2RetracePct=Math.abs((waves[2].price-waves[1].price)/w1Size)*100;
    if(w2RetracePct>=38&&w2RetracePct<=100) entryType='W2';
  }

  // W4 entry detection
  if(waves.length>=5){
    const w3Size=Math.abs(waves[3].price-waves[2].price);
    const w4RetracePct=Math.abs((waves[4].price-waves[3].price)/w3Size)*100;
    if(w4RetracePct>=23&&w4RetracePct<=38&&waves[4].price>waves[1].price) entryType='W4';
  }

  // Determine signal
  let status,statusColor,note;
  let sl,hardSl,tp1,tp2,tp3,tp4;
  const entry=[price*0.97,price*1.02];

  if(pctFromATH<-65&&(entryType==='W2'||entryType==='W4')){
    status=`🟢 STRONG BUY — ${entryType} Bottom Detected`;
    statusColor='#22c55e';
    note=`${entryType} entry confirmed. Price ${Math.abs(pctFromATH).toFixed(0)}% below ATH. RSI: ${curRSI.toFixed(0)}`;
    sl=price*0.85; hardSl=price*0.78;
    tp1=price*1.5; tp2=price*2.2; tp3=price*3.5; tp4=ath*1.1;
  } else if(pctFromATH<-50){
    status='🟡 WATCH — Approaching Buy Zone';
    statusColor='#f0b429';
    note=`${Math.abs(pctFromATH).toFixed(0)}% below ATH. Wait for RSI<40 + MACD cross. RSI now: ${curRSI.toFixed(0)}`;
    sl=price*0.87; hardSl=price*0.80;
    tp1=price*1.4; tp2=price*2.0; tp3=price*3.0; tp4=ath;
  } else if(pctFromATH<-25){
    status='🟠 CORRECTION — Not Ready Yet';
    statusColor='#f97316';
    note=`Wave C still unfolding. ${Math.abs(pctFromATH).toFixed(0)}% from ATH. Need deeper correction.`;
    sl=price*0.88; hardSl=price*0.82;
    tp1=price*1.25; tp2=price*1.6; tp3=price*2.2; tp4=ath;
  } else {
    status='🔵 NEAR ATH — Wait for Correction';
    statusColor='#3b82f6';
    note=`Only ${Math.abs(pctFromATH).toFixed(0)}% from ATH. No entry. Wait for 50%+ pullback.`;
    sl=price*0.88; hardSl=price*0.82;
    tp1=price*1.15; tp2=price*1.4; tp3=price*1.8; tp4=ath*1.2;
  }

  // Checklist
  const checks=[
    {l:'5-Wave Impulse Detected',ok:waves.length>=5,tip:'Need W1-W5 complete'},
    {l:'ABC Correction Identified',ok:waves.length>=6,tip:'Need corrective structure'},
    {l:'W2 or W4 Entry Zone',ok:entryType!=='',tip:'Must be at W2 or W4 bottom'},
    {l:'Price 50%+ Below ATH',ok:pctFromATH<-50,tip:`Currently ${pctFromATH.toFixed(0)}% from ATH`},
    {l:`RSI Below 45 (Now: ${curRSI.toFixed(0)})`,ok:curRSI<45,tip:'Need oversold reading'},
    {l:`MACD ${macdCross?'Crossed':'Turning'} Bullish`,ok:macdCross||macdTurning,tip:'Need bullish momentum'},
  ];

  // Golden Rule
  const goldenRule=MODE==='scalp'?
    'SCALP MODE: Only take longs when Daily trend is BULLISH':
    'SWING MODE: Daily bias must align with entry direction';

  return{status,statusColor,note,entry,sl,hardSl,tp1,tp2,tp3,tp4,pctFromATH,ath,checks,entryType,curRSI,macdCross,goldenRule,w2RetracePct:w2RetracePct.toFixed(0)};
}

// ── FORMAT HELPERS ───────────────────────────────────────────
function fp(p){
  if(!p&&p!==0) return'N/A';
  if(p>=1000) return'$'+p.toLocaleString('en-US',{maximumFractionDigits:0});
  if(p>=1) return'$'+p.toFixed(3);
  if(p>=0.01) return'$'+p.toFixed(4);
  return'$'+p.toFixed(6);
}
function fpc(p){return(p>=0?'+':'')+p.toFixed(1)+'%';}
function fpct(p){return p.toFixed(1)+'%';}

function drawPrice(data,waves,fibs,sig){
  const c=document.getElementById('priceChart');
  if(!c) return;
  const ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=c.offsetWidth,H=280;
  c.width=W*dpr; c.height=H*dpr; c.style.height=H+'px';
  ctx.scale(dpr,dpr);
  const P={t:16,r:70,b:24,l:60};
  const cW=W-P.l-P.r,cH=H-P.t-P.b;
  const prices=data.map(d=>d.price);
  const mn=Math.min(...prices)*0.98,mx=Math.max(...prices)*1.02,rng=mx-mn;
  const xS=i=>P.l+(i/(data.length-1))*cW;
  const yS=p=>P.t+cH-((p-mn)/rng)*cH;

  // Background
  ctx.fillStyle='#080c14'; ctx.fillRect(0,0,W,H);

  // Grid
  for(let i=0;i<=5;i++){
    const y=P.t+(i/5)*cH;
    ctx.strokeStyle='#1e293b'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(P.l,y); ctx.lineTo(P.l+cW,y); ctx.stroke();
    const price=mx-(i/5)*rng;
    ctx.fillStyle='#475569'; ctx.font='9px monospace'; ctx.textAlign='right';
    ctx.fillText(fp(price),P.l-3,y+3);
  }

  // X labels
  const step=Math.max(1,Math.floor(data.length/5));
  for(let i=0;i<data.length;i+=step){
    const d=data[i].date;
    let label;
    if(DAYS<=1) label=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    else if(DAYS<=30) label=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    else label=d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});
    ctx.fillStyle='#334155'; ctx.font='8px monospace'; ctx.textAlign='center';
    ctx.fillText(label,xS(i),H-4);
  }

  // Fib levels
  fibs.forEach(f=>{
    const y=yS(f.price);
    if(y<P.t||y>P.t+cH) return;
    ctx.strokeStyle=f.color; ctx.lineWidth=0.8; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(P.l,y); ctx.lineTo(P.l+cW,y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=f.color.replace('66','ff').replace('44','ff');
    ctx.font='8px monospace'; ctx.textAlign='left';
    ctx.fillText(f.label+' '+fp(f.price),P.l+cW+2,y+3);
  });

  // Entry zone
  if(sig){
    const y1=yS(sig.entry[1]),y2=yS(sig.entry[0]);
    ctx.fillStyle='#22c55e08';
    ctx.fillRect(P.l,Math.min(y1,y2),cW,Math.abs(y2-y1));
  }

  // SL line
  if(sig){
    const slY=yS(sig.sl);
    if(slY>=P.t&&slY<=P.t+cH){
      ctx.strokeStyle='#ef444466'; ctx.lineWidth=1; ctx.setLineDash([5,3]);
      ctx.beginPath(); ctx.moveTo(P.l,slY); ctx.lineTo(P.l+cW,slY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#ef4444'; ctx.font='bold 8px monospace'; ctx.textAlign='right';
      ctx.fillText('SL',P.l+cW+2,slY+3);
    }
  }

  // TP lines
  if(sig){
    [[sig.tp1,'TP1'],[sig.tp2,'TP2'],[sig.tp3,'TP3']].forEach(([tp,label])=>{
      const y=yS(tp);
      if(y<P.t||y>P.t+cH) return;
      ctx.strokeStyle='#22c55e44'; ctx.lineWidth=0.8; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(P.l,y); ctx.lineTo(P.l+cW,y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#22c55e'; ctx.font='bold 8px monospace'; ctx.textAlign='left';
      ctx.fillText(label,P.l+cW+2,y+3);
    });
  }

  // Area fill
  const gr=ctx.createLinearGradient(0,P.t,0,P.t+cH);
  gr.addColorStop(0,'rgba(240,180,41,0.15)'); gr.addColorStop(1,'rgba(240,180,41,0.01)');
  ctx.beginPath();
  data.forEach((d,i)=>i===0?ctx.moveTo(xS(i),yS(d.price)):ctx.lineTo(xS(i),yS(d.price)));
  ctx.lineTo(xS(data.length-1),P.t+cH); ctx.lineTo(xS(0),P.t+cH);
  ctx.closePath(); ctx.fillStyle=gr; ctx.fill();

  // Price line
  ctx.beginPath(); ctx.strokeStyle='#f0b429'; ctx.lineWidth=1.5;
  data.forEach((d,i)=>i===0?ctx.moveTo(xS(i),yS(d.price)):ctx.lineTo(xS(i),yS(d.price)));
  ctx.stroke();

  // Wave connecting lines
  if(waves.length>1){
    ctx.beginPath(); ctx.strokeStyle='rgba(240,180,41,0.4)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    waves.forEach((w,i)=>i===0?ctx.moveTo(xS(w.idx),yS(w.price)):ctx.lineTo(xS(w.idx),yS(w.price)));
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Wave dots and labels
  waves.forEach(w=>{
    const x=xS(w.idx),y=yS(w.price);
    const top=w.type==='peak',off=top?-22:22;
    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fillStyle=w.color; ctx.fill();
    ctx.strokeStyle='#000'; ctx.lineWidth=0.5; ctx.stroke();
    ctx.fillStyle=w.color; ctx.fillRect(x-16,y+off-8,32,15);
    ctx.fillStyle='#000'; ctx.font='bold 8px monospace'; ctx.textAlign='center';
    ctx.fillText(w.label,x,y+off+3);
    ctx.fillStyle=w.color; ctx.font='7px monospace';
    ctx.fillText(fp(w.price),x,y+off+(top?-12:18));
  });
}

function drawRSI(rsiArr){
  const c=document.getElementById('rsiChart');
  if(!c) return;
  const ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=c.offsetWidth,H=70;
  c.width=W*dpr; c.height=H*dpr; c.style.height=H+'px';
  ctx.scale(dpr,dpr);
  const vals=rsiArr.filter(v=>v!==null);
  const P={t:4,r:40,b:16,l:60};
  const cW=W-P.l-P.r,cH=H-P.t-P.b;

  ctx.fillStyle='#080c14'; ctx.fillRect(0,0,W,H);

  // Zones
  const y70=P.t+cH-((70)/100)*cH;
  const y30=P.t+cH-((30)/100)*cH;
  ctx.fillStyle='#ef444408'; ctx.fillRect(P.l,P.t,cW,y70-P.t);
  ctx.fillStyle='#22c55e08'; ctx.fillRect(P.l,y30,cW,P.t+cH-y30);

  [30,50,70].forEach(v=>{
    const y=P.t+cH-(v/100)*cH;
    ctx.strokeStyle='#1e293b'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(P.l,y); ctx.lineTo(P.l+cW,y); ctx.stroke();
    ctx.fillStyle='#475569'; ctx.font='8px monospace'; ctx.textAlign='right';
    ctx.fillText(v,P.l-3,y+3);
  });

  const validRSI=rsiArr.map((v,i)=>({v,i})).filter(x=>x.v!==null);
  if(validRSI.length<2) return;
  const xS=i=>P.l+(i/(rsiArr.length-1))*cW;
  const yS=v=>P.t+cH-(v/100)*cH;

  ctx.beginPath(); ctx.strokeStyle='#f97316'; ctx.lineWidth=1.5;
  let first=true;
  validRSI.forEach(({v,i})=>{
    first?ctx.moveTo(xS(i),yS(v)):ctx.lineTo(xS(i),yS(v));
    first=false;
  });
  ctx.stroke();

  const lastRSI=vals[vals.length-1];
  ctx.fillStyle=lastRSI<30?'#22c55e':lastRSI>70?'#ef4444':'#f97316';
  ctx.font='bold 9px monospace'; ctx.textAlign='left';
  ctx.fillText(`RSI ${lastRSI?.toFixed(1)}`,P.l+cW+2,P.t+cH/2+3);

  ctx.fillStyle='#475569'; ctx.font='8px monospace'; ctx.textAlign='right';
  ctx.fillText('RSI 14',P.l-3,P.t+8);
}

function drawMACD(macdData){
  const c=document.getElementById('macdChart');
  if(!c) return;
  const ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=c.offsetWidth,H=70;
  c.width=W*dpr; c.height=H*dpr; c.style.height=H+'px';
  ctx.scale(dpr,dpr);
  const P={t:4,r:40,b:16,l:60};
  const cW=W-P.l-P.r,cH=H-P.t-P.b;

  ctx.fillStyle='#080c14'; ctx.fillRect(0,0,W,H);

  const hist=macdData.hist.filter(v=>v!==null);
  if(!hist.length) return;
  const mx=Math.max(...hist.map(Math.abs))*1.1||1;
  const xS=i=>P.l+(i/(macdData.hist.length-1))*cW;
  const yMid=P.t+cH/2;
  const yS=v=>yMid-(v/mx)*(cH/2);

  // Zero line
  ctx.strokeStyle='#334155'; ctx.lineWidth=0.5;
  ctx.beginPath(); ctx.moveTo(P.l,yMid); ctx.lineTo(P.l+cW,yMid); ctx.stroke();

  // Histogram bars
  const barW=Math.max(1,cW/macdData.hist.length-0.5);
  macdData.hist.forEach((v,i)=>{
    if(v===null) return;
    const x=xS(i),y=yS(v);
    ctx.fillStyle=v>=0?'#22c55e66':'#ef444466';
    ctx.fillRect(x-barW/2,Math.min(y,yMid),barW,Math.abs(y-yMid));
  });

  // MACD line
  ctx.beginPath(); ctx.strokeStyle='#3b82f6'; ctx.lineWidth=1;
  let first=true;
  macdData.macd.forEach((v,i)=>{
    if(v===null) return;
    first?ctx.moveTo(xS(i),yS(v)):ctx.lineTo(xS(i),yS(v));
    first=false;
  });
  ctx.stroke();

  const lastHist=hist[hist.length-1];
  ctx.fillStyle=lastHist>=0?'#22c55e':'#ef4444';
  ctx.font='bold 9px monospace'; ctx.textAlign='left';
  ctx.fillText(`MACD`,P.l+cW+2,P.t+cH/2+3);

  ctx.fillStyle='#475569'; ctx.font='8px monospace'; ctx.textAlign='right';
  ctx.fillText('MACD',P.l-3,P.t+8);
}

function drawVolume(data){
  const c=document.getElementById('volChart');
  if(!c) return;
  const ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=c.offsetWidth,H=50;
  c.width=W*dpr; c.height=H*dpr; c.style.height=H+'px';
  ctx.scale(dpr,dpr);
  const P={t:4,r:40,b:16,l:60};
  const cW=W-P.l-P.r,cH=H-P.t-P.b;

  ctx.fillStyle='#080c14'; ctx.fillRect(0,0,W,H);

  const vols=data.map(d=>d.vol);
  const maxV=Math.max(...vols)||1;
  const barW=Math.max(1,cW/data.length-0.5);

  data.forEach((d,i)=>{
    const x=P.l+(i/(data.length-1))*cW;
    const h=(d.vol/maxV)*cH;
    const isUp=i>0&&d.price>=data[i-1].price;
    ctx.fillStyle=isUp?'#22c55e44':'#ef444444';
    ctx.fillRect(x-barW/2,P.t+cH-h,barW,h);
  });

  ctx.fillStyle='#475569'; ctx.font='8px monospace'; ctx.textAlign='right';
  ctx.fillText('VOL',P.l-3,P.t+8);
}
